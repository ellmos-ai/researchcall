[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcall"
version = "0.1.0"
description = "Dry-run-first tooling for standardized scientific telephone surveys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# The command line stays standard-library only, so the dry run keeps working with
# nothing installed. The workbench is the one part that needs a server.
[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
researchcall = "researchcall.cli:main"
researchcall-web = "researchcall.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchcall = ["fixtures/*.json"]
"researchcall.web" = ["locales/*.json", "static/*.js"]
