[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcall"
version = "0.1.0"
description = "Dry-run-first tooling for standardized scientific telephone surveys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
researchcall = "researchcall.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchcall = ["fixtures/*.json"]
