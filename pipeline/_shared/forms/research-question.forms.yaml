# Form definition — Station 1 (research question)

- field: question
  station: 01-research-question
  label: "Forschungsfrage"
  label_en: "Research question"
  question: "Was willst du herausfinden?"
  question_en: "What do you want to find out?"
  type: longtext
  options: []
  default: null
  help: "Ein Satz, der eine beantwortbare Frage formuliert und den Maßstab für alle späteren Items setzt."
  help_en: "One sentence that states an answerable question and sets the standard for every later item."
  required: true
  locked: false

- field: hypotheses
  station: 01-research-question
  label: "Hypothesen und Messvorschriften"
  label_en: "Hypotheses and measurement rules"
  question: "Was vermutest du, wie wird es gemessen und woran würdest du erkennen, dass es nicht stimmt?"
  question_en: "What do you expect, how is it measured, and what would show you that it is wrong?"
  type: table
  options: []
  default: []
  help: "Je Zeile: ID, prüfbare Aussage, Indikator oder Items und Falsifikationskriterium."
  help_en: "Per row: ID, testable statement, indicator or items, and falsification criterion."
  required: true
  locked: false
